<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeEncounter RPG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ffcb05;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: #3b4cca;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #2a3594;
        }
        .result-card {
            margin-top: 20px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .pokemon-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }
        .comum { background: #717171; }
        .incomum { background: #28a745; }
        .raro { background: #007bff; }
        .muito-raro { background: #8a2be2; }
        .sr-badge { background: #e67e22; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PokeEncounter RPG</h2>
        
        <div class="form-group">
            <label for="trainerLevel">Nível do Treinador (1 a 20):</label>
            <select id="trainerLevel">
                <option value="1">Nível 1 (Max SR 2)</option>
                <option value="3">Nível 3 (Max SR 5)</option>
                <option value="6">Nível 6 (Max SR 8)</option>
                <option value="8">Nível 8 (Max SR 10)</option>
                <option value="11">Nível 11 (Max SR 12)</option>
                <option value="14">Nível 14 (Max SR 14)</option>
                <option value="17">Nível 17 (Max SR 15)</option>
                <option value="20">Nível 20 (Max SR 15)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="environment">Ambiente:</label>
            <select id="environment">
                <option value="artico">❄️ Ártico</option>
            </select>
        </div>

        <button onclick="sortear()">Procurar Pokémon!</button>

        <div id="resultCard" class="result-card">
            <img id="pokeImg" class="pokemon-img" src="" alt="Pokémon">
            <h3 id="pokeName">---</h3>
            <div>
                <span id="pokeRarity" class="badge">---</span>
                <span id="pokeSR" class="badge sr-badge">SR ---</span>
            </div>
        </div>
    </div>

    <script>
        const database = {
            artico: {
                "Comum": [
                    { id: 613, name: "Cubchoo", srText: "1/4", srVal: 0.25 },
                    { id: 86, name: "Seel", srText: "1/2", srVal: 0.5 },
                    { id: 363, name: "Spheal", srText: "1/4", srVal: 0.25 },
                    { id: 582, name: "Vanillite", srText: "1/2", srVal: 0.5 },
                    { id: 220, name: "Swinub", srText: "1/4", srVal: 0.25 },
                    { id: 871, name: "Snom", srText: "1/8", srVal: 0.125 }
                ],
                "Incomum": [
                    { id: 712, name: "Bergmite", srText: "1/4", srVal: 0.25 },
                    { id: 234, name: "Stantler", srText: "5", srVal: 5 },
                    { id: 361, name: "Snorunt", srText: "1/4", srVal: 0.25 },
                    { id: 215, name: "Sneasel", srText: "4", srVal: 4 },
                    { id: 875, name: "Eiscue", srText: "6", srVal: 6 }
                ],
                "Raro": [
                    { id: 238, name: "Smoochum", srText: "2", srVal: 2 },
                    { id: 774, name: "Minior", srText: "4", srVal: 4 },
                    { id: 615, name: "Cryogonal", srText: "11", srVal: 11 }
                ],
                "Muito Raro": [
                    { id: 225, name: "Delibird", srText: "1", srVal: 1 },
                    { id: 131, name: "Lapras", srText: "10", srVal: 10 },
                    { id: 351, name: "Castform", srText: "5", srVal: 5 }
                ]
            }
        };

        function getMaxSR(level) {
            if (level <= 2) return 2;
            if (level <= 5) return 5;
            if (level <= 7) return 8;
            if (level <= 10) return 10;
            if (level <= 13) return 12;
            if (level <= 16) return 14;
            return 15;
        }

        function sortear() {
            const level = parseInt(document.getElementById('trainerLevel').value);
            const maxSR = getMaxSR(level);
            
            // Junta todos os pokémons do ártico que respeitam o SR máximo
            let validos = [];
            for (let raridade in database.artico) {
                let filtrados = database.artico[raridade].filter(p => p.srVal <= maxSR);
                filtrados.forEach(p => validos.push({ ...p, raridade: raridade }));
            }

            if (validos.length === 0) {
                alert("Nenhum Pokémon encontrado para este nível!");
                return;
            }

            // Sorteia um aleatório entre os válidos
            const escolhido = validos[Math.floor(Math.random() * validos.length)];

            // Atualiza a tela
            document.getElementById('pokeImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${escolhido.id}.png`;
            document.getElementById('pokeName').textContent = escolhido.name;
            
            const rarityEl = document.getElementById('pokeRarity');
            rarityEl.textContent = escolhido.raridade;
            rarityEl.className = "badge " + escolhido.raridade.toLowerCase().replace(" ", "-");

            document.getElementById('pokeSR').textContent = "SR " + escolhido.srText;
            document.getElementById('resultCard').style.display = "block";
        }
    </script>
</body>
</html>
