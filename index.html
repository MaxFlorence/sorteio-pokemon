<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéEncounter RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ffcb05;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: #3b4cca;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a3594;
        }
        .result-card {
            margin-top: 20px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .pokemon-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
            margin-right: 4px;
        }
        .comum { background: #717171; }
        .incomum { background: #28a745; }
        .raro { background: #007bff; }
        .muito-raro { background: #8a2be2; }
        .sr-badge { background: #e67e22; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PokéEncounter RPG</h2>
        
        <div class="form-group">
            <label for="trainerLevel">Nível do Treinador (1 a 20):</label>
            <select id="trainerLevel">
                <option value="1">Nível 1 (Max SR 2)</option>
                <option value="2">Nível 2 (Max SR 2)</option>
                <option value="3">Nível 3 (Max SR 5)</option>
                <option value="4">Nível 4 (Max SR 5)</option>
                <option value="5">Nível 5 (Max SR 5)</option>
                <option value="6">Nível 6 (Max SR 8)</option>
                <option value="7">Nível 7 (Max SR 8)</option>
                <option value="8">Nível 8 (Max SR 10)</option>
                <option value="9">Nível 9 (Max SR 10)</option>
                <option value="10">Nível 10 (Max SR 10)</option>
                <option value="11">Nível 11 (Max SR 12)</option>
                <option value="12">Nível 12 (Max SR 12)</option>
                <option value="13">Nível 13 (Max SR 12)</option>
                <option value="14">Nível 14 (Max SR 14)</option>
                <option value="15">Nível 15 (Max SR 14)</option>
                <option value="16">Nível 16 (Max SR 14)</option>
                <option value="17">Nível 17 (Max SR 15)</option>
                <option value="18">Nível 18 (Max SR 15)</option>
                <option value="19">Nível 19 (Max SR 15)</option>
                <option value="20">Nível 20 (Max SR 15)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="environment">Selecione o Ambiente / Região:</label>
            <select id="environment">
                <option value="artico">❄️ Ártico</option>
            </select>
        </div>

        <button type="button" onclick="sortear()">Procurar Pokémon!</button>

        <div id="resultCard" class="result-card">
            <img id="pokeImg" class="pokemon-img" src="" alt="Pokémon">
            <h3 id="pokeName">---</h3>
            <div>
                <span id="pokeRarity" class="badge">---</span>
                <span id="pokeSR" class="badge sr-badge">SR ---</span>
            </div>
        </div>
    </div>
