<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéEncounter RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ffcb05;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: #3b4cca;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a3594;
        }
        .result-card {
            margin-top: 20px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .pokemon-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 0 auto;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
            margin-right: 4px;
        }
        .comum { background: #717171; }
        .incomum { background: #28a745; }
        .raro { background: #007bff; }
        .muito-raro { background: #8a2be2; }
        .sr-badge { background: #e67e22; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PokéEncounter RPG</h2>
        
        <div class="form-group">
            <label for="trainerLevel">Nível do Treinador (1 a 20):</label>
            <select id="trainerLevel">
                <option value="1">Nível 1 (Max SR 2)</option>
                <option value="2">Nível 2 (Max SR 2)</option>
                <option value="3">Nível 3 (Max SR 5)</option>
                <option value="4">Nível 4 (Max SR 5)</option>
                <option value="5">Nível 5 (Max SR 5)</option>
                <option value="6">Nível 6 (Max SR 8)</option>
                <option value="7">Nível 7 (Max SR 8)</option>
                <option value="8">Nível 8 (Max SR 10)</option>
                <option value="9">Nível 9 (Max SR 10)</option>
                <option value="10">Nível 10 (Max SR 10)</option>
                <option value="11">Nível 11 (Max SR 12)</option>
                <option value="12">Nível 12 (Max SR 12)</option>
                <option value="13">Nível 13 (Max SR 12)</option>
                <option value="14">Nível 14 (Max SR 14)</option>
                <option value="15">Nível 15 (Max SR 14)</option>
                <option value="16">Nível 16 (Max SR 14)</option>
                <option value="17">Nível 17 (Max SR 15)</option>
                <option value="18">Nível 18 (Max SR 15)</option>
                <option value="19">Nível 19 (Max SR 15)</option>
                <option value="20">Nível 20 (Max SR 15)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="environment">Ambiente:</label>
            <select id="environment">
                <option value="artico">❄️ Ártico</option>
            </select>
        </div>

        <button type="button" id="btnRoll" onclick="sortear()">Procurar Pokémon!</button>

        <div id="resultCard" class="result-card">
            <img id="pokeImg" class="pokemon-img" src="" alt="Pokémon" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';">
            <h3 id="pokeName">---</h3>
            <div>
                <span id="pokeRarity" class="badge">---</span>
                <span id="pokeSR" class="badge sr-badge">SR ---</span>
            </div>
        </div>
    </div>

    <script>
        const database = {
            artico: {
                "Comum": [
                    { name: "Cubchoo", srText: "1/4", srVal: 0.25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/613.png" },
                    { name: "Seel", srText: "1/2", srVal: 0.5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/86.png" },
                    { name: "Spheal", srText: "1/4", srVal: 0.25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/363.png" },
                    { name: "Vanillite", srText: "1/2", srVal: 0.5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/582.png" },
                    { name: "Swinub", srText: "1/4", srVal: 0.25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/220.png" },
                    { name: "Snom", srText: "1/8", srVal: 0.125, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/872.png" },
                    { name: "Scatterbug", srText: "1/8", srVal: 0.125, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/664.png" }
                ],
                "Incomum": [
                    { name: "Bergmite", srText: "1/4", srVal: 0.25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/712.png" },
                    { name: "Stantler", srText: "5", srVal: 5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/234.png" },
                    { name: "Shellder", srText: "1/2", srVal: 0.5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/90.png" },
                    { name: "Snorunt", srText: "1/4", srVal: 0.25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/361.png" },
                    { name: "Crabrawler", srText: "1", srVal: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/739.png" },
                    { name: "Deerling", srText: "2", srVal: 2, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/585.png" },
                    { name: "Sneasel", srText: "4", srVal: 4, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/215.png" },
                    { name: "Eiscue", srText: "6", srVal: 6, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/875.png" },
                    { name: "Sandshrew (Alola)", srText: "1/2", srVal: 0.5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10101.png" },
                    { name: "Vulpix (Alola)", srText: "1/4", srVal: 0.25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10103.png" },
                    { name: "Cetoddle", srText: "1", srVal: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/975.png" }
                ],
                "Raro": [
                    { name: "Smoochum", srText: "2", srVal: 2, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/238.png" },
                    { name: "Sneasel (Hisui)", srText: "4", srVal: 4, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10235.png" },
                    { name: "Darumaka (Galar)", srText: "1/2", srVal: 0.5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10173.png" },
                    { name: "Mime Jr.", srText: "1", srVal: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/439.png" },
                    { name: "Minior", srText: "4", srVal: 4, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/774.png" },
                    { name: "Cryogonal", srText: "11", srVal: 11, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/615.png" }
                ],
                "Muito Raro": [
                    { name: "Delibird", srText: "1", srVal: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/225.png" },
                    { name: "Snover", srText: "1", srVal: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/459.png" },
                    { name: "Lapras", srText: "10", srVal: 10, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/131.png" },
                    { name: "Castform", srText: "5", srVal: 5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/351.png" },
                    { name: "Frigibax", srText: "1", srVal: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/996.png" },
                    { name: "Piplup", srText: "1/2", srVal: 0.5, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/393.png" }
                ]
            }
        };

        function getMaxSR(level) {
            if (level <= 2) return 2;
            if (level <= 5) return 5;
            if (level <= 7) return 8;
            if (level <= 10) return 10;
            if (level <= 13) return 12;
            if (level <= 16) return 14;
            return 15;
        }

        function sortear() {
            try {
                const levelSelect = document.getElementById('trainerLevel');
                const level = parseInt(levelSelect.value) || 1;
                const maxSR = getMaxSR(level);
                const envSelect = document.getElementById('environment').value;
                const envData = database[envSelect];

                if (!envData) return;

                let validos = [];
                for (let raridade in envData) {
                    let filtrados = envData[raridade].filter(p => p.srVal <= maxSR);
                    filtrados.forEach(p => validos.push({ ...p, raridade: raridade }));
                }

                if (validos.length === 0) {
                    alert("Nenhum Pokémon disponível para o Nível e SR selecionados.");
                    return;
                }

                const escolhido = validos[Math.floor(Math.random() * validos.length)];

                const pokeImg = document.getElementById('pokeImg');
                const pokeName = document.getElementById('pokeName');
                const rarityEl = document.getElementById('pokeRarity');
                const srEl = document.getElementById('pokeSR');
                const card = document.getElementById('resultCard');

                pokeImg.src = escolhido.img;
                pokeName.textContent = escolhido.name;
                
                rarityEl.textContent = escolhido.raridade;
                rarityEl.className = "badge " + escolhido.raridade.toLowerCase().replace(" ", "-");

                srEl.textContent = "SR " + escolhido.srText;
                card.style.display = "block";

            } catch (err) {
                console.error("Erro no sorteio:", err);
                alert("Ocorreu um erro. Tente novamente.");
            }
        }
    </script>
</body>
</html>
