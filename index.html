<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéEncounter - Sorteador RPG (Ártico)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3rem;
            color: #ffcb05;
            text-shadow: 3px 3px #3b4cca;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #aaa;
            font-size: 0.85rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffcb05;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #ffcb05;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b4cca;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(59, 76, 202, 0.4);
        }

        button:hover {
            background: #2a3594;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-card {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: none;
        }

        .result-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        .pokemon-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 10px auto;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .pokemon-name {
            font-size: 1.3rem;
            font-weight: 600;
            text-transform: capitalize;
            margin-bottom: 5px;
        }

        .rarity-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 5px 4px 0 4px;
        }

        .sr-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #e67e22;
            color: #fff;
            margin: 5px 4px 0 4px;
        }

        .rarity-comum { background: #717171; color: #fff; }
        .rarity-incomum { background: #28a745; color: #fff; }
        .rarity-raro { background: #007bff; color: #fff; }
        .rarity-muito-raro { background: #8a2be2; color: #fff; box-shadow: 0 0 10px rgba(138, 43, 226, 0.6); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>PokéEncounter RPG</h1>
        <p class="subtitle">Teste de Sorteio por SR & Nível do Treinador (Ártico)</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="trainerLevel">Nível do Treinador (1 a 20):</label>
            <select id="trainerLevel">
                <!-- Opções de Nível 1 a 20 -->
                <script>
                    for(let i=1; i<=20; i++){
                        document.write(`<option value="${i}">Nível ${i}</option>`);
                    }
                </script>
            </select>
        </div>

        <div class="form-group">
            <label for="environment">Ambiente:</label>
            <select id="environment">
                <option value="artico">❄️ Ártico</option>
            </select>
        </div>

        <button onclick="sortearPokemon()">Procurar Pokémon!</button>

        <div id="resultCard" class="result-card">
            <p style="font-size: 0.85rem; color: #bbb; margin-bottom: 5px;">Um Pokémon selvagem apareceu!</p>
            <img id="pokeImg" class="pokemon-img" src="" alt="Pokémon">
            <div id="pokeName" class="pokemon-name">---</div>
            <div>
                <span id="pokeRarity" class="rarity-badge">---</span>
                <span id="pokeSR" class="sr-badge
