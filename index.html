<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéEncounter - Sorteio por Ecossistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.4rem;
            color: #ffcb05;
            text-shadow: 3px 3px #3b4cca;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #aaa;
            font-size: 0.85rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffcb05;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #ffcb05;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b4cca;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(59, 76, 202, 0.4);
        }

        button:hover {
            background: #2a3594;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Cartão de Resultado */
        .result-card {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: none;
        }

        .result-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        .pokemon-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 10px auto;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

            font-size: 1.3rem;
            font-weight: 600;
            text-transform
