<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéRarity - Sorteio de Encounters</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5rem;
            color: #ffcb05;
            text-shadow: 3px 3px #3b4cca;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #aaa;
            font-size: 0.9rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffcb05;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #ffcb05;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b4cca;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(59, 76, 202, 0.4);
        }

        button:hover {
            background: #2a3594;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Resultado */
        .result-card {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: none;
        }

        .result-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        .pokemon-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin: 10px auto;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .pokemon-name {
            font-size: 1.3rem;
            font-weight: 600;
            text-transform: capitalize;
            margin-bottom: 5px;
        }

        .rarity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Cores de Raridade */
        .rarity-comum { background: #717171; color: #fff; }
        .rarity-incomum { background: #228B22; color: #fff; }
        .rarity-raro { background: #1E90FF; color: #fff; }
        .rarity-epico { background: #9370DB; color: #fff; }
        .rarity-lendario { background: #FFD700; color: #000; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>PokéEncounter</h1>
        <p class="subtitle">Descubra qual Pokémon habita esta área!</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="environment">Selecione o Ambiente:</label>
            <select id="environment">
                <option value="floresta">Florestas e Bosques</option>
                <option value="caverna">Cavernas Escuras</option>
                <option value="praia">Praias e Costa</option>
            </select>
        </div>

        <button onclick="sortearPokemon()">Procurar Pokémon!</button>

        <div id="resultCard" class="result-card">
            <p style="font-size: 0.85rem; color: #bbb; margin-bottom: 5px;">Um Pokémon selvagem apareceu!</p>
            <img id="pokeImg" class="pokemon-img" src="" alt="Pokémon">
            <div id="pokeName" class="pokemon-name">---</div>
            <div id="pokeRarity" class="rarity-badge">---</div>
        </div>
    </div>

    <script>
        // Banco de Dados simulado por ambiente com pesos de raridade
        // Quanto menor o peso, mais raro é de aparecer.
        const database = {
            floresta: [
                { name: "Caterpie", rarity: "Comum", weight: 50, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/10.png" },
                { name: "Bulbasaur", rarity: "Raro", weight: 15, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" },
                { name: "Pikachu", rarity: "Incomum", weight: 25, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" },
                { name: "Scyther", rarity: "Épico", weight: 8, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/123.png" },
                { name: "Celebi", rarity: "Lendário", weight: 2, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/251.png" }
            ],
            caverna: [
                { name: "Zubat", rarity: "Comum", weight: 50, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/41.png" },
                { name: "Geodude", rarity: "Comum", weight: 40, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/74.png" },
                { name: "Onix", rarity: "Raro", weight: 15, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/95.png" },
                { name: "Larvitar", rarity: "Épico", weight: 8, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/246.png" },
                { name: "Mewtwo", rarity: "Lendário", weight: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/150.png" }
            ],
            praia: [
                { name: "Magikarp", rarity: "Comum", weight: 50, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/129.png" },
                { name: "Tentacool", rarity: "Comum", weight: 40, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/72.png" },
                { name: "Squirtle", rarity: "Raro", weight: 15, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" },
                { name: "Lapras", rarity: "Épico", weight: 6, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/131.png" },
                { name: "Kyogre", rarity: "Lendário", weight: 1, img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/382.png" }
            ]
        };

        function sortearPokemon() {
            const ambienteSelecionado = document.getElementById('environment').value;
            const listaPokemons = database[ambienteSelecionado];

            // Soma total dos pesos para probabilidade ponderada
            const pesoTotal = listaPokemons.reduce((total, poke) => total + poke.weight, 0);
            let sorteioAleatorio = Math.random() * pesoTotal;

            let pokemonEscolhido = listaPokemons[0];

            for (let poke of listaPokemons) {
                if (sorteioAleatorio < poke.weight) {
                    pokemonEscolhido = poke;
                    break;
                }
                sorteioAleatorio -= poke.weight;
            }

            // Exibir na tela
            const resultCard = document.getElementById('resultCard');
            const pokeImg = document.getElementById('pokeImg');
            const pokeName = document.getElementById('pokeName');
            const pokeRarity = document.getElementById('pokeRarity');

            pokeImg.src = pokemonEscolhido.img;
            pokeName.textContent = pokemonEscolhido.name;
            pokeRarity.textContent = pokemonEscolhido.rarity;
            
            // Atualizar classes CSS da raridade
            pokeRarity.className = `rarity-badge rarity-${pokemonEscolhido.rarity.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "")}`;

            resultCard.classList.remove('active');
            void resultCard.offsetWidth; // Reflow para reiniciar a animação
            resultCard.classList.add('active');
        }
    </script>
</body>
</html>
