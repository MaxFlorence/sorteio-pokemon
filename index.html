<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéEncounter - Sorteio por Ecossistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.4rem;
            color: #ffcb05;
            text-shadow: 3px 3px #3b4cca;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #aaa;
            font-size: 0.85rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffcb05;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #ffcb05;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b4cca;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(59, 76, 202, 0.4);
        }

        button:hover {
            background: #2a3594;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Cartão de Resultado */
        .result-card {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: none;
        }

        .result-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        .pokemon-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 10px auto;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .pokemon-name {
            font-size: 1.3rem;
            font-weight: 600;
            text-transform: capitalize;
            margin-bottom: 5px;
        }

        .rarity-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Estilos das 4 Raridades */
        .rarity-comum { background: #717171; color: #fff; }
        .rarity-incomum { background: #28a745; color: #fff; }
        .rarity-raro { background: #007bff; color: #fff; }
        .rarity-muito-raro { background: #8a2be2; color: #fff; box-shadow: 0 0 10px rgba(138, 43, 226, 0.6); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>PokéEncounter</h1>
        <p class="subtitle">Sorteador por Áreas e Raridades (Kanto a Paldea)</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="environment">Selecione a Área de Encontro:</label>
            <select id="environment">
                <option value="artico">❄️ Ártico</option>
                <option value="assombrados">👻 Assombrados</option>
                <option value="caverna">🦇 Caverna</option>
                <option value="deserto">Cacto Deserto</option>
                <option value="desfiladeiro">⛰️ Desfiladeiro</option>
                <option value="floresta">🌲 Florestas e Bosques</option>
                <option value="mar_aberto">🌊 Mar Aberto</option>
                <option value="montanhas">🏔️ Montanhas</option>
                <option value="pantano">🐸 Pântano</option>
                <option value="pesca">🎣 Pesca</option>
                <option value="planicie">🌾 Planície</option>
                <option value="praia">🏖️ Praia</option>
                <option value="rios_lagos">🏞️ Rios e Lagos</option>
                <option value="urbano">🏙️ Urbano</option>
                <option value="vulcao">🌋 Vulcão</option>
            </select>
        </div>

        <button onclick="sortearPokemon()">Procurar Pokémon!</button>

        <div id="resultCard" class="result-card">
            <p style="font-size: 0.85rem; color: #bbb; margin-bottom: 5px;">Um Pokémon selvagem apareceu!</p>
            <img id="pokeImg" class="pokemon-img" src="" alt="Pokémon">
            <div id="pokeName" class="pokemon-name">---</div>
            <div id="pokeRarity" class="rarity-badge">---</div>
        </div>
    </div>

            "Incomum": 30,
            "Raro": 15,

        // Função auxiliar para montar links de sprites oficiais da PokéAPI por ID

        // Banco de Dados das 15 Áreas (Apenas Formas Base e Sem Evolução)

            },

            },

            },

            },

                "Incomum": [{ id: 116, name: "Horsea" }, { id: 318, name: "Carvanha" }, { id: 846, name: "Arrokuda" }],

            },
            praia: {

                "Incomum": [{ id: 54, name: "Psyduck" }, { id: 79, name: "Slowpoke" }, { id: 769, name: "Sandygast" }],
                "Raro": [{ id: 7, name: "Squirtle" }, { id: 120, name: "Staryu" }, { id: 960, name: "Wigglett" }],

            },
            rios_lagos: {
                "Comum": [{ id: 54, name: "Psyduck" }, { id: 194, name: "Wooper" }, { id: 418, name: "Buizel" }],
                "Incomum": [{ id: 60, name: "Poliwag" }, { id: 158, name: "Totodile" }, { id: 535, name: "Tympole" }, { id: 912, name: "Quaxly" }],

            },
            urbano: {
                "Comum": [{ id: 52, name: "Meowth" }, { id: 81, name: "Magnemite" }, { id: 568, name: "Trubbish" }],
                "Incomum": [{ id: 88, name: "Grimer" }, { id: 100, name: "Voltorb" }, { id: 431, name: "Glameow" }, { id: 848, name: "Toxel" }],
                "Raro": [{ id: 137, name: "Porygon" }, { id: 441, name: "Chatot" }, { id: 854, name: "Sinistea" }],
                "Muito Raro": [{ id: 440, name: "Happiny" }, { id: 479, name: "Rotom" }]
            },
            vulcao: {
                "Comum": [{ id: 218, name: "Slugma" }, { id: 322, name: "Numel" }, { id: 837, name: "Rolycoly" }],
                "Incomum": [{ id: 4, name: "Charmander" }, { id: 155, name: "Cyndaquil" }, { id: 255, name: "Torchic" }, { id: 909, name: "Fuecoco" }],
                "Raro": [{ id: 126, name: "Magmar" }, { id: 324, name: "Torkoal" }, { id: 757, name: "Salandit" }],
                "Muito Raro": [{ id: 631, name: "Heatmor" }, { id: 935, name: "Charcadet" }]
            }
        };

        function sortearPokemon() {
            const ambiente = document.getElementById('environment').value;
            const ambienteAtual = database[ambiente];

            // 1. Roll da Raridade
            const roll = Math.random() * 100;
            let raridadeSorteada = "Comum";

            if (roll < RARITY_CHANCES["Muito Raro"]) {
                raridadeSorteada = "Muito Raro";
            } else if (roll < RARITY_CHANCES["Muito Raro"] + RARITY_CHANCES["Raro"]) {
                raridadeSorteada = "Raro";
            } else if (roll < RARITY_CHANCES["Muito Raro"] + RARITY_CHANCES["Raro"] + RARITY_CHANCES["Incomum"]) {
                raridadeSorteada = "Incomum";
            } else {
                raridadeSorteada = "Comum";
            }

            // 2. Busca lista da raridade no ambiente
            let listaDaRaridade = ambienteAtual[raridadeSorteada];
            if (!listaDaRaridade || listaDaRaridade.length === 0) {
                raridadeSorteada = "Comum";
                listaDaRaridade = ambienteAtual["Comum"];
            }

            // 3. Seleciona um Pokémon aleatório
            const pokemonEscolhido = listaDaRaridade[Math.floor(Math.random() * listaDaRaridade.length)];

            // 4. Exibe na tela
            const resultCard = document.getElementById('resultCard');
            const pokeImg = document.getElementById('pokeImg');
            const pokeName = document.getElementById('pokeName');
            const pokeRarity = document.getElementById('pokeRarity');

            pokeImg.src = getSprite(pokemonEscolhido.id);
            pokeName.textContent = `#${pokemonEscolhido.id} ${pokemonEscolhido.name}`;
            pokeRarity.textContent = raridadeSorteada;

            const classeRaridade = `rarity-${raridadeSorteada.toLowerCase().replace(" ", "-")}`;
            pokeRarity.className = `rarity-badge ${classeRaridade}`;

            resultCard.classList.remove('active');
            void resultCard.offsetWidth; // Força reinício da animação
            resultCard.classList.add('active');
        }
    </script>
</body>
</html>
